name: docs

on:
  pull_request:
    paths: ["docs/**", "docsite/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "docsite/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsite
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.30.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: pnpm
          cache-dependency-path: docsite/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run audit:content
      - run: pnpm build
      - run: pnpm validate
