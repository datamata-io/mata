name: docs

on:
  pull_request:
    paths: ["docs/**", "docsite/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "docsite/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docsite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: docsite/package-lock.json
      - run: npm ci
      - run: npm run audit:content
      - run: npm run build
      - run: npm run validate
